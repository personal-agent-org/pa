[package]
name = "pa-agent"
version.workspace = true
edition.workspace = true
description = "Personal Agent device agent - connect a Linux machine and serve coding tools to Personal Agent chats"

[lib]
name = "pa_agent"
path = "src/lib.rs"

[dependencies]
pa-oidc = { path = "../pa-oidc" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
walkdir = "2"
globset = "0.4"
# Normalize canonicalized paths on Windows: std::fs::canonicalize returns an
# extended-length `\\?\C:\...` path that git (worktree/clone dest, --work-tree)
# rejects with "Invalid argument". dunce::canonicalize strips the verbatim prefix
# when safe and is identical to std on Unix.
dunce = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
anyhow = "1"
portable-pty = "0.8"
base64 = "0.22"
# webpki-roots + the process-installed crypto provider (ring) - share one provider
# with tungstenite to avoid a rustls multi-provider handshake conflict.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json"] }
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
# Process-group kill for timed-out run_command trees (no orphan daemons on ports).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# OS-level command sandbox: landlock write-confinement for run_command (opt-in, fail-safe).
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
