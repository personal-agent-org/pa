<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Agent</title>
    <style>
      :root { --blue: #2f5da6; }
      html, body { margin: 0; height: 100%; background: #0f1013; color: #e9eaef;
        font-family: system-ui, sans-serif; }
      .wrap { height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; padding: 24px; }
      h1 { font-size: 1.15rem; margin: 0; }
      p { margin: 0; max-width: 360px; text-align: center; color: #9aa0ab; font-size: .85rem; }
      form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; }
      input { background: #0a0a0a; border: 1px solid #2a2d34; border-radius: 8px; color: #e9eaef;
        padding: 11px 12px; font-size: .95rem; }
      input:focus { outline: none; border-color: var(--blue); }
      button { background: var(--blue); border: 0; border-radius: 8px; color: #fff; padding: 11px;
        font-size: .95rem; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      .err { color: #e06c6c; font-size: .8rem; min-height: 1em; text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Personal Agent</h1>
      <p id="intro"></p>
      <form id="f">
        <input id="url" type="url" inputmode="url" autofocus required />
        <button id="go" type="submit"></button>
        <div class="err" id="err"></div>
      </form>
    </div>
    <script>
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
      const intro = document.getElementById("intro");
      const f = document.getElementById("f");
      const url = document.getElementById("url");
      const err = document.getElementById("err");
      const go = document.getElementById("go");

      // Strings come from ui/locales/<lang>.json (the same source Weblate manages and the
      // Rust tray embeds), so the setup screen and the tray stay in sync.
      const EN = {
        setup_intro: "Enter your Personal Agent server URL to connect.",
        setup_placeholder: "https://your-instance.example",
        setup_connect: "Connect",
        setup_connecting: "Connecting...",
      };
      let t = EN;
      async function loadLocale() {
        const lang = (navigator.language || "en").toLowerCase().startsWith("de") ? "de" : "en";
        if (lang === "en") return;
        try {
          const res = await fetch("locales/" + lang + ".json");
          if (res.ok) t = { ...EN, ...(await res.json()) };
        } catch (e) {
          /* keep English fallback */
        }
      }
      (async () => {
        await loadLocale();
        intro.textContent = t.setup_intro;
        url.placeholder = t.setup_placeholder;
        go.textContent = t.setup_connect;
      })();

      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        let v = url.value.trim();
        if (v && !/^https?:\/\//i.test(v)) v = "https://" + v;
        go.disabled = true;
        go.textContent = t.setup_connecting;
        try {
          await invoke("set_server", { url: v }); // saves the URL + relaunches into the SPA
        } catch (e2) {
          err.textContent = String(e2);
          go.disabled = false;
          go.textContent = t.setup_connect;
        }
      });
    </script>
  </body>
</html>
