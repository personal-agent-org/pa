[package]
name = "pa"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "Personal Agent terminal chat client"

[[bin]]
name = "pa"
path = "src/main.rs"

[dependencies]
pa-oidc = { path = "../pa-oidc" }
pa-tui = { path = "../pa-tui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Process-level crypto provider for rustls 0.23 (the no-provider reqwest/tungstenite
# feature both libs use). Installed once here in main().
rustls = { version = "0.23", features = ["ring"] }
