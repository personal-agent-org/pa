name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: GUI build deps (webkit2gtk, gtk3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-bin
      - name: Icons for the gui crate
        run: |
          cd crates/pa-gui
          for s in 32 128 256 512; do rsvg-convert -w "$s" -h "$s" app-icon.svg -o "icons/${s}x${s}.png"; done
          cp icons/256x256.png icons/128x128@2x.png && cp icons/512x512.png icons/icon.png
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - name: Build headless (tui + service)
        run: cargo build --release
      - name: Build with the GUI feature
        run: cargo build --release --features gui
