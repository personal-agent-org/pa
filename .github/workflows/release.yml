name: Release

# CalVer (YYYY.M.MICRO), run manually. Builds the terminal `pa` chat client for every platform,
# tags, and uploads the per-platform binaries. The `desktop-linux` job then builds the
# gui-enabled bundle (.deb + AppImage) via the Tauri bundler and attaches it to the release.
on:
  workflow_dispatch:
    inputs:
      micro:
        description: "MICRO version within this month (0, 1, 2, ...)"
        required: true
        default: "0"

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pa-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: pa-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: pa-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Terminal build: pa-gui is a workspace member but NOT compiled here (no --features gui),
      # so no webview toolchain is needed on any runner.
      - name: Build pa (headless) for ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }} -p pa
      - name: Stage the binary under its asset name
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/pa"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: bins
          merge-multiple: true
      - name: Compute CalVer
        id: ver
        run: echo "version=$(date -u +%Y).$(date -u +%-m).${{ github.event.inputs.micro }}" >> "$GITHUB_OUTPUT"
      - name: Tag, release, upload
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.ver.outputs.version }}"
          git rev-parse "$v" >/dev/null 2>&1 || { git tag "$v" && git push origin "$v"; }
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --title "$v" --generate-notes
          gh release upload "$v" --clobber \
            bins/pa-linux-x64 bins/pa-macos-arm64 bins/pa-windows-x64.exe
          id=$(gh release view "$v" --json databaseId --jq .databaseId)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  desktop-linux:
    # Desktop bundle: the SAME pa built with --features gui, wrapped as AppImage + .deb by the
    # Tauri bundler. Runs after `release` so the tag exists; uploads the bundles to it.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bundle deps
        run: |
          sudo apt-get update
          # librsvg2-dev (not just -bin) is required: linuxdeploy-plugin-gtk reads
          # `pkg-config --variable=libdir librsvg-2.0`, which only the -dev .pc file provides.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-bin librsvg2-dev
      - name: Icons
        run: |
          cd crates/pa
          for s in 32 128 256 512; do rsvg-convert -w "$s" -h "$s" app-icon.svg -o "icons/${s}x${s}.png"; done
          cp icons/256x256.png icons/128x128@2x.png && cp icons/512x512.png icons/icon.png
      - name: Compute CalVer
        id: ver
        run: echo "version=$(date -u +%Y).$(date -u +%-m).${{ github.event.inputs.micro }}" >> "$GITHUB_OUTPUT"
      - name: Install the Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub-hosted runners have no FUSE, so appimagetool/linuxdeploy can't mount their
          # runtime; extract-and-run makes them unpack to a tmpdir instead. Without this the
          # AppImage bundle step hangs/fails on ubuntu-latest.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          # tauri.conf.json lives in the pa binary crate; build with the gui feature. No
          # tagName/releaseId => build only; we upload under stable names below. Bundle
          # targets = ["deb", "appimage"] in tauri.conf.json.
          projectPath: crates/pa
          args: --features gui
          tauriScript: cargo tauri
      - name: Upload the bundles under stable names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ steps.ver.outputs.version }}"
          appimage=$(find target -type f -name "*.AppImage" | head -1)
          deb=$(find target -type f -name "*.deb" | head -1)
          # Upload each bundle independently so a missing one never blocks the other.
          if [ -n "$appimage" ]; then
            cp "$appimage" personal-agent.AppImage
            gh release upload "$v" --clobber personal-agent.AppImage
          fi
          if [ -n "$deb" ]; then
            cp "$deb" personal-agent.deb
            gh release upload "$v" --clobber personal-agent.deb
          fi
